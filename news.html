<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Bunt News Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>.font-baseball { font-family: 'Teko', sans-serif; letter-spacing: 0.05em; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">
  <div class="max-w-xl mx-auto p-6">
    <h1 class="font-baseball text-5xl text-amber-400">JB Bunt News Desk</h1>
    <p class="text-xs text-slate-400 mb-6">Posts here show up in the game automatically.</p>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
      <input id="author" placeholder="Post as (name people will see)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white">
      <input id="title" placeholder="Title" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white">
      <textarea id="body" rows="4" placeholder="News update" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white"></textarea>
      <input id="image" placeholder="Photo link (imgur) optional" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white">
      <label class="flex items-center gap-2 text-xs text-slate-300"><input id="shop" type="checkbox"> Add a link to the shop</label>
      <button onclick="postNews()" class="w-full bg-amber-500 text-slate-950 font-extrabold py-2 rounded-lg">Post to Game</button>
      <p id="err" class="text-red-400 text-xs"></p>
    </div>

    <div class="mt-4">
      <h2 class="font-bold text-amber-300 mb-2">Live posts</h2>
      <div id="list" class="space-y-2"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAkxFfbjR_4Q-DLlBWK7yA7ybfwW8Pl8U",
      authDomain: "jbbunt26.firebaseapp.com",
      projectId: "jbbunt26",
      storageBucket: "jbbunt26.firebasestorage.app",
      messagingSenderId: "583905105072",
      appId: "1:583905105072:web:c5f0826de9af9735f49775"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let posts = [];

    const q = query(collection(db, "news"), orderBy("timestamp", "desc"), limit(20));
    onSnapshot(q, (snap) => {
      posts = [];
      snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
      render();
    }, () => {});

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = posts.length ? "" : '<p class="text-slate-500 text-xs">No posts yet.</p>';
      posts.forEach(n => {
        list.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2">
            ${n.image ? `<img src="${n.image}" class="w-40 h-40 object-cover rounded-lg">` : ""}
            <p class="font-bold text-amber-300">${n.title}</p>
            <p class="text-[10px] text-slate-500">by ${n.author || "Owner"}</p>
            <p class="text-xs text-slate-300">${n.body}</p>
            <p class="text-[10px] text-slate-500">${n.shopLink ? "Shop link on" : "No shop link"} · ${(n.likes||[]).length} likes</p>
            <button onclick="editPost('${n.id}')" class="text-[10px] bg-slate-800 px-2 py-1 rounded">Edit</button>
            <button onclick="deletePost('${n.id}')" class="text-[10px] bg-red-600/40 text-red-200 px-2 py-1 rounded">Delete</button>
          </div>`;
      });
    }

    function fixImageUrl(url) {
      if (!url) return "";
      let u = url.trim();
      const m = u.match(/imgur\\.com\\/(?:a\\/|gallery\\/)?([A-Za-z0-9]+)/);
      if (m && !u.includes("i.imgur.com")) u = "https://i.imgur.com/" + m[1] + ".png";
      return u;
    }

    async function ensureAuth() {
      if (auth.currentUser) return;
      await signInWithPopup(auth, new GoogleAuthProvider());
    }

    window.postNews = async () => {
      const author = document.getElementById("author").value.trim() || "Owner";
      const title = document.getElementById("title").value.trim();
      const body = document.getElementById("body").value.trim();
      const image = fixImageUrl(document.getElementById("image").value.trim());
      const shopLink = document.getElementById("shop").checked;
      if (!title || !body) return alert("Add a title and a message.");
      try {
        await ensureAuth();
        await addDoc(collection(db, "news"), {
          title, body, image, shopLink, likes: [], comments: [],
          timestamp: Date.now(), author
        });
        document.getElementById("title").value = "";
        document.getElementById("body").value = "";
        document.getElementById("image").value = "";
        document.getElementById("shop").checked = false;
        document.getElementById("err").textContent = "";
      } catch (e) {
        document.getElementById("err").textContent = e.message;
      }
    };

    window.editPost = async (id) => {
      const n = posts.find(x => x.id === id);
      if (!n) return;
      const author = prompt("Post as", n.author || "Owner");
      if (author === null) return;
      const title = prompt("Title", n.title);
      if (title === null) return;
      const body = prompt("Message", n.body);
      if (body === null) return;
      const imageRaw = prompt("Photo link (blank to remove)", n.image || "");
      if (imageRaw === null) return;
      const image = fixImageUrl(imageRaw);
      const shop = confirm("Add a link to the shop? OK = yes, Cancel = no");
      try {
        await ensureAuth();
        await updateDoc(doc(db, "news", id), { author, title, body, image, shopLink: shop });
      } catch (e) {
        document.getElementById("err").textContent = e.message;
      }
    };
    window.deletePost = async (id) => {
      if (!confirm("Delete this post?")) return;
      try {
        await ensureAuth();
        await deleteDoc(doc(db, "news", id));
      } catch (e) {
        document.getElementById("err").textContent = e.message;
      }
    };
  </script>
</body>
</html>
